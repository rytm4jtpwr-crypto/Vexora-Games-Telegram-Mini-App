<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Rocket Animation Demo</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a12;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
  #stage{position:relative;width:100%;height:100vh;overflow:hidden;}
  canvas{position:absolute;top:0;left:0;}
  #mult{
    position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);
    font-size:56px;font-weight:800;color:#a78bfa;text-shadow:0 0 24px rgba(167,139,250,.8);
    pointer-events:none;opacity:0;transition:opacity .2s;
  }
  #controls{position:absolute;bottom:24px;left:0;right:0;display:flex;gap:12px;justify-content:center;z-index:10;}
  button{
    padding:14px 28px;border-radius:999px;border:none;font-weight:700;font-size:15px;cursor:pointer;
  }
  #launchBtn{background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;}
  #crashBtn{background:#1f2937;color:#f87171;border:1px solid #ef4444;}
  #status{position:absolute;top:16px;left:0;right:0;text-align:center;color:#666;font-size:13px;letter-spacing:.5px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="mult">1.00x</div>
  <div id="status">IDLE — нажми "Запустить"</div>
  <div id="controls">
    <button id="launchBtn">🚀 Запустить</button>
    <button id="crashBtn">💥 Краш</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const multEl = document.getElementById('mult');
const statusEl = document.getElementById('status');
let W, H;
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ---------- Звёздная сетка на фоне ----------
const dots = [];
for(let y=100;y<0.9*window.innerHeight;y+=70){
  for(let x=20;x<window.innerWidth;x+=70){
    dots.push({x:x+(Math.random()*10-5), y:y+(Math.random()*10-5), r:Math.random()*1.5+0.5});
  }
}

// ---------- Состояние игры ----------
let state = 'idle';       // idle | flying | crashed
let t0 = 0;                // время старта полёта
let elapsed = 0;
let idleT = 0;
let multiplier = 1.00;
const growthRate = 0.28;   // скорость роста множителя (подбери под свою игру)
let trail = [];            // точки нарисованной траектории
let particles = [];
let rocketScreenPos = {x:0,y:0,angle:0};
let crashParticles = [];

// стартовая позиция ракеты в режиме ожидания
function idlePos(){
  return {x: W*0.5, y: H*0.34};
}

// ---------- Траектория ----------
// прогресс p идёт от 0 до 1, easeOutExpo — крутизна нарастает к концу
function easeOutExpo(p){
  return p === 1 ? 1 : 1 - Math.pow(2, -10*p);
}
function trajectoryPoint(p){
  const startX = W*0.05, startY = H*0.78;
  const endX = W*0.95,   endY = H*0.08;
  const x = startX + (endX-startX) * p;
  const y = startY + (endY-startY) * easeOutExpo(p);
  return {x,y};
}

function startFlight(){
  state = 'flying';
  t0 = performance.now();
  multiplier = 1.00;
  trail = [];
  particles = [];
  statusEl.textContent = 'ПОЛЁТ';
  multEl.style.opacity = 1;
}

function crash(){
  if(state !== 'flying') return;
  state = 'crashed';
  statusEl.textContent = 'КРАШ на ' + multiplier.toFixed(2) + 'x';
  crashParticles = [];
  for(let i=0;i<24;i++){
    const a = Math.random()*Math.PI*2;
    const sp = Math.random()*6+2;
    crashParticles.push({
      x: rocketScreenPos.x, y: rocketScreenPos.y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: 1
    });
  }
  setTimeout(()=>{
    state='idle'; multEl.style.opacity=0; statusEl.textContent='IDLE — нажми "Запустить"'; trail=[];
  }, 1400);
}

document.getElementById('launchBtn').onclick = ()=>{ if(state==='idle') startFlight(); };
document.getElementById('crashBtn').onclick = crash;

// ---------- Отрисовка ракеты (векторная, замени на свою PNG-текстуру) ----------
function drawRocket(x, y, angle, wobble){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle + wobble);

  // пламя
  const flameLen = 26 + Math.random()*10;
  const g = ctx.createLinearGradient(0, 18, 0, 18+flameLen);
  g.addColorStop(0, 'rgba(255,220,120,0.95)');
  g.addColorStop(1, 'rgba(255,80,120,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-6, 18); ctx.lineTo(6, 18); ctx.lineTo(0, 18+flameLen);
  ctx.closePath(); ctx.fill();

  // корпус
  const bodyGrad = ctx.createLinearGradient(-14,-28,14,28);
  bodyGrad.addColorStop(0, '#22d3ee');
  bodyGrad.addColorStop(0.5, '#a78bfa');
  bodyGrad.addColorStop(1, '#f472b6');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.moveTo(0,-30);
  ctx.quadraticCurveTo(14,-6,10,18);
  ctx.lineTo(-10,18);
  ctx.quadraticCurveTo(-14,-6,0,-30);
  ctx.closePath();
  ctx.fill();
  ctx.shadowColor = '#c084fc'; ctx.shadowBlur = 18; ctx.fill();
  ctx.shadowBlur = 0;

  // плавники
  ctx.fillStyle = '#7c3aed';
  ctx.beginPath(); ctx.moveTo(-10,8); ctx.lineTo(-24,22); ctx.lineTo(-8,18); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10,8); ctx.lineTo(24,22); ctx.lineTo(8,18); ctx.closePath(); ctx.fill();

  ctx.restore();
}

// ---------- Главный цикл ----------
function loop(now){
  ctx.clearRect(0,0,W,H);

  // фон-точки
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  dots.forEach(d=>{ ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,7); ctx.fill(); });

  if(state === 'idle'){
    idleT += 0.02;
    const p = idlePos();
    const wobble = Math.sin(idleT) * 0.1;          // покачивание ±0.1 рад
    const bob = Math.sin(idleT*1.3) * 6;            // вертикальное дыхание
    rocketScreenPos = {x:p.x, y:p.y+bob};
    drawRocket(p.x, p.y+bob, -Math.PI/2, wobble);    // носом вверх
  }

  if(state === 'flying'){
    elapsed = (now - t0) / 1000;
    multiplier = 1 + (Math.exp(growthRate*elapsed) - 1);
    multEl.textContent = multiplier.toFixed(2) + 'x';

    // прогресс кривой — растёт медленнее в начале, чтобы совпадать с ощущением игры
    const progress = Math.min(1, 1 - 1/(1+elapsed*0.35));
    const pt = trajectoryPoint(progress);
    trail.push(pt);
    if(trail.length > 400) trail.shift();

    // рисуем линию-траекторию
    ctx.strokeStyle = 'rgba(167,139,250,0.9)';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#a78bfa'; ctx.shadowBlur = 12;
    ctx.beginPath();
    trail.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.stroke();
    ctx.shadowBlur = 0;

    // угол по касательной (по двум последним точкам)
    let angle = -Math.PI/2;
    if(trail.length>2){
      const a = trail[trail.length-2], b = trail[trail.length-1];
      angle = Math.atan2(b.y-a.y, b.x-a.x) + Math.PI/2;
    }
    const wobble = Math.sin(now*0.006)*0.06;
    rocketScreenPos = {x: pt.x, y: pt.y, angle};

    // если ракета ещё не улетела за верх — рисуем её
    if(pt.y > H*0.06){
      drawRocket(pt.x, pt.y, angle, wobble);
      // частицы
      if(Math.random()<0.6){
        particles.push({x:pt.x, y:pt.y, vx:(Math.random()-0.5)*1.5, vy:Math.random()*1.5+1, life:1});
      }
    } else {
      multEl.style.top = '30%';
    }

    particles.forEach(pp=>{
      pp.x += pp.vx; pp.y += pp.vy; pp.life -= 0.03;
      ctx.globalAlpha = Math.max(pp.life,0);
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.arc(pp.x,pp.y,2,0,7); ctx.fill();
      ctx.globalAlpha = 1;
    });
    particles = particles.filter(pp=>pp.life>0);

    if(progress>=0.998 && multiplier>40){
      // авто-краш демо, чтобы цикл не длился вечно
      crash();
    }
  }

  if(state === 'crashed'){
    // линия остаётся
    ctx.strokeStyle = 'rgba(239,68,68,0.8)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    trail.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
    ctx.stroke();

    crashParticles.forEach(pp=>{
      pp.x += pp.vx; pp.y += pp.vy; pp.vy += 0.15; pp.life -= 0.02;
      ctx.globalAlpha = Math.max(pp.life,0);
      ctx.fillStyle = '#fb923c';
      ctx.beginPath(); ctx.arc(pp.x,pp.y,3,0,7); ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
